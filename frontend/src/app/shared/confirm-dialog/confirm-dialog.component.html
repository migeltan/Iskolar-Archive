<div class="confirm">
  <span class="confirm__icon">
    <mat-icon>delete</mat-icon>
  </span>
  <p class="confirm__message">{{ data.message }}</p>
  <div class="confirm__actions">
    <button mat-stroked-button type="button" [mat-dialog-close]="false">Cancel</button>
    <button mat-flat-button type="button" [mat-dialog-close]="true">
      {{ data.confirmLabel ?? 'Delete' }}
    </button>
  </div>
</div>

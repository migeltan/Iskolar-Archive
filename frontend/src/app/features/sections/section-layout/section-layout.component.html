<div class="page">
  <a class="back" routerLink="/courses">
    <mat-icon>arrow_back</mat-icon>
    My courses
  </a>

  <header
    class="banner"
    [class.has-image]="!!cover()"
    [style.--c1]="design.c1"
    [style.--c2]="design.c2"
    [attr.data-pattern]="design.pattern"
    [style.background]="bannerBackground()"
  >
    <div class="banner__text">
      <h1 class="banner__name">{{ section()?.name ?? 'Section' }}</h1>
      @if (section(); as current) {
        <p class="banner__code">Section code: {{ current.sectionCode }}</p>
      }
    </div>

    <!-- Cover controls -->
    <input
      #coverInput
      type="file"
      hidden
      accept="image/png,image/jpeg,image/webp"
      (change)="onCoverSelected($event)"
    />
    <button
      type="button"
      class="banner__edit"
      aria-label="Change cover"
      [matMenuTriggerFor]="coverMenu"
    >
      <mat-icon>image</mat-icon>
      Change cover
    </button>
    <mat-menu #coverMenu="matMenu" panelClass="cover-menu">
      <button mat-menu-item type="button" (click)="coverInput.click()">Upload image</button>
      <button mat-menu-item type="button" [disabled]="!cover()" (click)="resetCover()">
        Use default
      </button>
    </mat-menu>
  </header>

  <nav class="tabs" aria-label="Section">
    @for (item of navItems; track item.path) {
      <a class="tab" [routerLink]="item.path" routerLinkActive="active">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <router-outlet />
</div>
